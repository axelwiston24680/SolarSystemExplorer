plugins {
    id 'com.android.application'
}

android {
    namespace 'com.axelwiston.solarsystemexplorer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.axelwiston.solarsystemexplorer'
        minSdk 23
        // Keep Android 15 edge-to-edge enforcement from obscuring this
        // prototype's content until explicit window-inset handling is added.
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
}
